name: fruit_analyzer_mobile
description: "AI-Powered Fruit Ripeness Analyzer"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  camera: ^0.11.0+2
  onnxruntime: ^1.4.1
  image: ^4.2.0
  path_provider: ^2.1.3
  flutter_local_notifications: ^17.1.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  file_picker: ^8.0.0+1
  http: ^1.6.0
  provider: ^6.1.5+1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  intl: ^0.19.0
  dio: ^5.4.1
  font_awesome_flutter: 10.7.0
  google_sign_in: ^6.2.1
  firebase_core: ^3.11.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.3
  mongo_dart: ^0.10.0
  photo_view: ^0.15.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model/fruit_model.onnx
    - assets/model/fruit_resnet18_model.pth
    - assets/data/nutrients.json
    - assets/data/model_info.json
