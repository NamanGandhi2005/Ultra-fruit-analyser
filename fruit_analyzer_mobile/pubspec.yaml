name: fruit_analyzer_mobile
description: "AI-Powered Fruit Ripeness Analyzer"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  camera: ^0.11.0+2
  onnxruntime: ^1.4.1
  image: ^4.2.0
  path_provider: ^2.1.3
  flutter_local_notifications: ^17.1.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  http: ^1.6.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model/fruit_model.onnx
    - assets/data/nutrients.json
    - assets/data/model_info.json
